spring.application.name=interntrack-api
server.port=${SERVER_PORT:8080}
spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/interntrack?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# The fallback key is for local development only. Override it in application-local.properties.
app.jwt.secret=${JWT_SECRET:interntrack-local-development-key-change-before-deploy}
app.jwt.expiration=PT24H
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
